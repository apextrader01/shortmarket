name: Build SkandX Android App

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Configure Environment (Staging vs Production)
        run: |
          if [ "${{ github.ref_name }}" = "development" ]; then
            echo "ENV_NAME=Staging" >> $GITHUB_ENV
            echo "APP_NAME=SkandX Staging" >> $GITHUB_ENV
            echo "APP_ID=com.skandx.app.staging" >> $GITHUB_ENV
            echo "API_URL=https://staging.skandx.in" >> $GITHUB_ENV
            echo "ARTIFACT_PREFIX=SkandX-Staging" >> $GITHUB_ENV
          else
            echo "ENV_NAME=Production" >> $GITHUB_ENV
            echo "APP_NAME=SkandX" >> $GITHUB_ENV
            echo "APP_ID=com.skandx.app" >> $GITHUB_ENV
            echo "API_URL=https://www.skandx.in" >> $GITHUB_ENV
            echo "ARTIFACT_PREFIX=SkandX-Production" >> $GITHUB_ENV
          fi

      - name: Build React App
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: npm run build

      - name: Configure Capacitor & Android Identifiers
        working-directory: ./frontend
        run: |
          node -e '
            const fs = require("fs");
            const cap = JSON.parse(fs.readFileSync("capacitor.config.json"));
            cap.appName = process.env.APP_NAME;
            cap.appId = process.env.APP_ID;
            cap.server.url = process.env.API_URL;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cap, null, 2));
          '
          sed -i "s/applicationId \"com.skandx.app\"/applicationId \"$APP_ID\"/" android/app/build.gradle
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" android/app/src/main/res/values/strings.xml
          sed -i "s/<string name=\"title_activity_main\">.*<\/string>/<string name=\"title_activity_main\">$APP_NAME<\/string>/" android/app/src/main/res/values/strings.xml
          sed -i "s/<string name=\"package_name\">.*<\/string>/<string name=\"package_name\">$APP_ID<\/string>/" android/app/src/main/res/values/strings.xml
          sed -i "s/<string name=\"custom_url_scheme\">.*<\/string>/<string name=\"custom_url_scheme\">$APP_ID<\/string>/" android/app/src/main/res/values/strings.xml

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Platforms 35 & 36
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"

      - name: Generate Release Keystore
        working-directory: ./frontend/android/app
        run: |
          keytool -genkeypair -v -keystore skandx-release.keystore \
            -alias skandx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "SkandX@Release2026" \
            -keypass "SkandX@Release2026" \
            -dname "CN=SkandX, OU=Trading, O=SkandX Technologies, L=Chennai, ST=TN, C=IN"

      - name: Build Android App (AAB & APK)
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew
          ./gradlew bundleRelease assembleRelease -x test --no-daemon --stacktrace

      - name: Upload Direct Installable Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-APK
          path: frontend/android/app/build/outputs/apk/release/
          if-no-files-found: warn

      - name: Upload Play Store Release Bundle (.aab)
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: SkandX-GooglePlay-AAB
          path: frontend/android/app/build/outputs/bundle/release/
          if-no-files-found: error

      - name: Upload Signing Keystore (Keep this safe)
        uses: actions/upload-artifact@v4
        with:
          name: SkandX-Release-Keystore
          path: frontend/android/app/skandx-release.keystore
          if-no-files-found: warn

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Reports
          path: frontend/android/app/build/reports/
          if-no-files-found: ignore
