name: Build SkandX Android App

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React App
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Platform 35 & Accept Licenses
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Generate Release Keystore
        working-directory: ./frontend/android/app
        run: |
          keytool -genkeypair -v -keystore skandx-release.keystore \
            -alias skandx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "SkandX@Release2026" \
            -keypass "SkandX@Release2026" \
            -dname "CN=SkandX, OU=Trading, O=SkandX Technologies, L=Chennai, ST=TN, C=IN"

      - name: Build Release Bundle & APK
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew
          ./gradlew bundleRelease assembleRelease -x test --no-daemon --stacktrace
          echo "=== LISTING OUTPUT FILES ==="
          ls -la app/build/outputs/bundle/release/ || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Play Store Release Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: SkandX-GooglePlay-AAB
          path: frontend/android/app/build/outputs/bundle/release/
          if-no-files-found: error

      - name: Upload Direct Install APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: SkandX-Release-APK
          path: frontend/android/app/build/outputs/apk/release/
          if-no-files-found: warn

      - name: Upload Signing Keystore (Keep this safe)
        uses: actions/upload-artifact@v4
        with:
          name: SkandX-Release-Keystore
          path: frontend/android/app/skandx-release.keystore
          if-no-files-found: warn
