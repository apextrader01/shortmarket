<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Inner Soft Glow -->
  <circle cx="256" cy="256" r="150" fill="#38bdf8" opacity="0.08" filter="url(#neonGlow)" />

  <g filter="url(#intenseGlow)">
    <!-- Candlestick Bar 1 (Left Far) -->
    <line x1="140" y1="270" x2="140" y2="340" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <rect x="134" y="285" width="12" height="42" rx="3" fill="url(#greenCyan)" />

    <!-- Candlestick Bar 2 (Left Mid) -->
    <line x1="168" y1="235" x2="168" y2="320" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <rect x="162" y="250" width="12" height="52" rx="3" fill="#38bdf8" />

    <!-- Candlestick Bar 3 (Left Near) -->
    <line x1="196" y1="210" x2="196" y2="290" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <rect x="190" y="225" width="12" height="45" rx="3" fill="#38bdf8" />

    <!-- Candlestick Bar 4 (Top Left Center) -->
    <line x1="220" y1="168" x2="220" y2="250" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
    <rect x="214" y="188" width="12" height="46" rx="3" fill="#00f0ff" />

    <!-- Candlestick Bar 5 (Right Near) -->
    <line x1="316" y1="195" x2="316" y2="280" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <rect x="310" y="215" width="12" height="48" rx="3" fill="#38bdf8" />

    <!-- Candlestick Bar 6 (Right Mid) -->
    <line x1="344" y1="230" x2="344" y2="315" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <rect x="338" y="248" width="12" height="48" rx="3" fill="#38bdf8" />

    <!-- Candlestick Bar 7 (Right Far) -->
    <line x1="372" y1="265" x2="372" y2="345" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
    <rect x="366" y="280" width="12" height="46" rx="3" fill="#2563eb" />

    <!-- The Iconic Stylized "X" -->
    <!-- Diagonal 1: Top-Left to Bottom-Right -->
    <path d="M 152 160 L 210 160 L 360 352 L 302 352 Z" fill="url(#cyanBlue)" />
    <!-- Diagonal 2: Top-Right to Bottom-Left -->
    <path d="M 360 160 L 302 160 L 152 352 L 210 352 Z" fill="url(#cyanBlue)" />

    <!-- Inner Core Highlight for 3D Cybernetic Effect -->
    <path d="M 166 166 L 202 166 L 346 346 L 310 346 Z" fill="#ffffff" opacity="0.25" />
    <path d="M 346 166 L 310 166 L 166 346 L 202 346 Z" fill="#ffffff" opacity="0.25" />
  </g>
</svg>